[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cadrecipe"
version = "0.1.0"
description = "Open, CAD-neutral recipe format for parametric parts: recover design intent from STEP and rebuild it natively in each CAD system."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["build123d>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cadrecipe = "cadrecipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
